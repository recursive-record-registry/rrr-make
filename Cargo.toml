[package]
name = "rrr-make"
description = "A command-line utility for the creation of Recursive Record Registries"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "rrr_make"
path = "src/lib.rs"

[[bin]]
name = "rrr-make"
path = "src/bin.rs"
required-features = ["cmd"]

[features]
cmd = ["clap", "tracing-error", "tracing-subscriber"]

[dependencies]
chrono = "0.4.45"
color-eyre = "0.6.5"
ed25519-dalek = { version = "3.0", features = ["rand_core", "pem"] }
futures = "0.3.34"
# Workaround for a bug in `include_dir` 0.7.4 (the latest release): its `nightly` feature uses
# `proc_macro` APIs that have since been renamed on nightly Rust, so it no longer compiles.
# Without that feature, changes to the included assets are tracked by `build.rs` instead.
# See https://github.com/Michael-F-Bryan/include_dir/issues/118. Once fixed, re-enable
# `features = ["nightly"]` and remove `build.rs`.
include_dir = "0.7.4"
itertools = "0.15.0"
rand = "0.10.3"
rrr = { git = "https://github.com/recursive-record-registry/rrr.git", rev = "bd182c6b88ddb45cd1cfa7b9acd242f4956e6916" }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_with = "3.24"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["full"] }
toml = { version = "1.2", features = ["preserve_order"] }
toml_edit = { version = "0.25.18", features = ["serde"] }
tracing = "0.1.44"
# Dependencies of the executable binary
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-error = { version = "0.2.1", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3.27"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
